apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
helmCharts:
  - name: kube-prometheus-stack
    repo: http://prometheus-community.github.io/helm-charts
    namespace: monitoring
    version: 92.3.0
    releaseName: kube-prometheus-stack
    includeCRDs: true
    valuesFile: values.yaml