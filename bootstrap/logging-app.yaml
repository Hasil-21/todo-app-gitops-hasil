apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-logging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Hasil-21/todo-app-gitops-hasil.git
    targetRevision: main
    path: logging/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true