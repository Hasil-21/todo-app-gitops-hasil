apiVersion: argoproj.io/v1aplha1
kind: Application
metadata: 
  name: todo-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Hasil-21/todo-app-gitops-hasil.git
    targetRevision: main
    path: backend/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: todo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true