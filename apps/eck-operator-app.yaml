apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-eck-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/Hasil-21/todo-app-gitops-hasil.git
    targetRevision: main
    path: eck-operator/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: eck-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true