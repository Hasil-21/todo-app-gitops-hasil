apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
spec:
  project: default
  
  source:
    - repoURL: https://github.com/Hasil-21/todo-app-gitops-hasil.git
      targetRevision: main
      path: bootstrap/frontend

    - repoURL: https://github.com/Hasil-21/todo-app-gitops-hasil.git
      targetRevision: main
      path: bootstrap/backend
  
    - repoURL: https://github.com/Hasil-21/todo-app-gitops-hasil.git
      targetRevision: main
      path: bootstrap/ingress

    - repoURL: https://github.com/Hasil-21/todo-app-gitops-hasil.git
      targetRevision: main
      path: bootstrap/logging

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true